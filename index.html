<script type="module">

import { addCombo, executeCombo } from "./RUN/combo.js";
import { applyColorRules } from "./RUN/score.js";
import { nextGate, orbitGate } from "./RUN/gates.js";
import { techPulse } from "./RUN/tech.js";
import { RealityPulse } from "./RUN/realitypulse.js";
import { MIACORE } from "./RUN/mia-core.js";
import { MIATribunal } from "./RUN/mia-tribunal.js";
import { stabiliseRoom } from "./RUN/wloch.js";
import { ecoShift } from "./RUN/eco-shift.js";
import { loadAllRooms } from "./GateRoomLoader.js";

let turns = 0;
let score = 0;
let tick = 0;
let gate = "meKI";        // SPIEL STARTET BEI meKI
let rooms = {};
let currentRoom = null;

async function initGame(){
    rooms = await loadAllRooms();
    currentRoom = rooms.meKI;   // Startpunkt
}

initGame();

// Untere Buttons → keine Kosten
export function onLowerButton(action){
    addCombo(action);
}

// Ausführende Instanz → alles zusammen = EIN Zug
export function onExecute(){

/* ⭐ SYSTEM-DIAGNOSE */
async function systemCheck(){
  try {
    const rooms = await loadAllRooms();

    if(!rooms.meKI || !rooms.GA || !rooms.MIE){
      alert("FEHLER: 3-Stationen-System unvollständig.\nBitte prüfe: meKI.room, GA.room, MIE.room");
      return;
    }

    alert("SYSTEM OK · 3×756 Räume geladen · ALLXALL aktiv.");
  } catch(e){
    alert("FEHLER beim Laden der Rooms:\n" + e.message);
  }
}

systemCheck();

    
    turns++;

    // 1. Combo ausführen
    const comboResult = executeCombo();

    // 2. Farben-Regeln anwenden
    score = applyColorRules(comboResult, score, turns);

    // 3. 3-RESPO-GATEN
    gate = nextGate(gate);

    // 4. ALLXALL-Orbit
    gate = orbitGate(turns);

    // 5. 756-Achsen Tech
    const tech = techPulse(tick);

    // 6. WLOCH-Pulse
    const pulse = stabiliseRoom(currentRoom);

    // 7. RealityPulse
    const reality = RealityPulse(currentRoom, tick);

    // 8. MIA-CORE + MIA-TRIBUNAL
    const verdict = MIATribunal({
        pulse,
        tech,
        mode: reality.meta.mode,
        score,
        turns,
        gate
    });

    console.log("GAME-VERDICT:", verdict);

    // 9. ECO-3D Shift-Indexer
    ecoShift(reality);

    tick++;

    // 10. Spielende nach 13 Zügen
    if(turns >= 13){
        endGame(verdict);
    }
}

</script>
