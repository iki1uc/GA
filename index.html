<script type="module">

import { loadAllRooms } from "./GateRoomLoader.js";
import { stabiliseRoom } from "./stabiliseRoom.js";
import { IDkoop } from "./IDkoop.js";
import { IDneutral } from "./IDneutral.js";
import { IDpook } from "./IDpook.js";
import ANKER from "./ANKER.json" assert { type: "json" };

// 756-Achsen Meta-Format
const AXIS_756 = {
    pulse: ["GA", "meKI", "MIE"],
    tech: ["IX", "XI", "X4"],
    mode: ["ALL-IN", "ALL-OUT"],
    raw: "./ANKER.raw"
};

async function runALLXALL(){

    // 1. ALLE ROOMS LADEN
    const rooms = await loadAllRooms();

    // 2. ALLE ROM-DATEIEN LADEN
    const roms = {};
    for(const key of AXIS_756.pulse){
        roms[key] = await fetch(`./WLOCH/${key}.rom`).then(r=>r.text());
    }

    // 3. ANKER + RAW LADEN
    const anchor = ANKER;
    const raw = await fetch(AXIS_756.raw).then(r=>r.text());

    // 4. ID-MODULE
    const ID = { IDkoop, IDneutral, IDpook };

    // 5. META-STATE
    let current = rooms.GA;
    let tick = 0;

    setInterval(()=>{

        // 6. Stabilisation
        const next = stabiliseRoom(current);

        // 7. IX / XI / X4 TECH
        const IX = tick % 9;
        const XI = tick % 11;
        const X4 = tick % 4;

        // 8. ALL-IN / ALL-OUT
        const MODE = (tick % 2 === 0) ? "ALL-IN" : "ALL-OUT";

        // 9. META-DATENPAKET
        const META = {
            axis: AXIS_756,
            mode: MODE,
            tick,
            IX,
            XI,
            X4,
            room: current,
            rom: roms[current.gate],
            anchor,
            raw,
            id: ID,
            pulse: next
        };

        console.log("ALLXALL META:", META);

        // 10. Routing über Pulse-Achse
        if(next.soll === 2) current = rooms.meKI;
        if(next.soll === 3) current = rooms.MIE;
        if(next.soll === 1) current = rooms.GA;

        tick++;

    }, 300);
}

runALLXALL();

</script>
